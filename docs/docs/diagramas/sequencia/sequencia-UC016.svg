nt-weight="normal" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">dados para o período”</text><text x="530.0" y="751.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">14: ValidationException</text><text x="352.4" y="783.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">15: 422 informa o limite</text><text x="174.8" y="815.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">16: aviso de período</text><text x="174.8" y="832.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">inválido</text><text x="28.0" y="361.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">alt</text><text x="64.0" y="361.0" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">[período válido]</text><text x="18.0" y="730.0" text-anchor="start" font-size="12.5" font-weight="normal" fill="#374151" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">[período maior que 24 meses]</text></svg>