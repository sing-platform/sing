# CD depois que o workflow "ci" fica verde em push na main.
#
# Servidor: deploy@147.15.96.215, diretorio /opt/sing.
# Secrets do environment production: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY.
#
# A chave publica no servidor fica restrita em authorized_keys:
#   no-pty,no-agent-forwarding,no-X11-forwarding
# Por isso este job so usa ssh/scp nao interativos: -n -T, RequestTTY=no,
# sem -t, sem encaminhamento de agent ou X11, e sem sudo.
#
# Sem `uses:`: o repositorio recusa action de terceiro na validacao.

name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 50 origin refs/heads/main
          git checkout --detach "${SOURCE_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Publicar imagens arm64
        env:
          TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt:latest --install arm64
          docker buildx create --name singbuilder --driver docker-container --use --bootstrap
          publish() {
            name="$1"
            context="$2"
            docker buildx build \
              --platform linux/arm64 \
              --push \
              --provenance=false \
              --sbom=false \
              --tag "ghcr.io/sing-platform/${name}:${IMAGE_TAG}" \
              --tag "ghcr.io/sing-platform/${name}:latest" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${IMAGE_TAG}" \
              "${context}"
          }
          publish core services/core
          publish documents services/documents

      - name: Enviar compose e subir
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_PATH}" ] || [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${IMAGE_TAG}" ]; then
            echo "Secret de deploy ausente (DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY)." >&2
            exit 1
          fi
          case "${DEPLOY_HOST}" in
            *[!0-9A-Za-z.:-]*) echo "DEPLOY_HOST invalido" >&2; exit 1 ;;
          esac
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9._-]*) echo "DEPLOY_USER invalido" >&2; exit 1 ;;
          esac
          case "${DEPLOY_PATH}" in
            /*) ;;
            *) echo "DEPLOY_PATH precisa ser absoluto" >&2; exit 1 ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9/_.-]*) echo "DEPLOY_PATH contem caracteres nao permitidos" >&2; exit 1 ;;
          esac
          if ! printf '%s' "${IMAGE_TAG}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "IMAGE_TAG inesperado" >&2
            exit 1
          fi

          install -d -m 700 "${HOME}/.ssh"
          trap 'rm -f "${HOME}/.ssh/sing_deploy"' EXIT
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/sing_deploy"
          chmod 600 "${HOME}/.ssh/sing_deploy"
          touch "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          # -n -T e RequestTTY=no: a chave tem no-pty e a sessao nao pode pedir TTY.
          # Sem -t, sem -A, sem -X. O usuario deploy ja esta no grupo docker; sem sudo.
          opts=(
            -o BatchMode=yes
            -o RequestTTY=no
            -o IdentitiesOnly=yes
            -o IdentityAgent=none
            -o ForwardAgent=no
            -o ForwardX11=no
            -o ClearAllForwardings=yes
            -o StrictHostKeyChecking=accept-new
            -o PreferredAuthentications=publickey
            -o ConnectTimeout=20
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -i "${HOME}/.ssh/sing_deploy"
          )
          target="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh -nT "${opts[@]}" "${target}" "mkdir -p -- '${DEPLOY_PATH}/traefik/dynamic'"
          scp "${opts[@]}" \
            deploy/docker-compose.yml \
            deploy/docker-compose.prod.yml \
            "${target}:${DEPLOY_PATH}/"
          scp "${opts[@]}" \
            deploy/traefik/dynamic/routes.yml \
            "${target}:${DEPLOY_PATH}/traefik/dynamic/routes.yml"
          ssh -nT "${opts[@]}" "${target}" \
            "cd '${DEPLOY_PATH}' && export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml IMAGE_TAG='${IMAGE_TAG}' && docker compose pull && docker compose up -d && docker image prune -f"
