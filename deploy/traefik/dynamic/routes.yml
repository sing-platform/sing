# Roteamento declarativo (file provider).
#
# Optamos por file provider em vez do docker provider por dois motivos:
#   1. seguranca — o docker provider exige montar /var/run/docker.sock no
#      container do gateway, o que equivale a dar acesso root ao host;
#   2. compatibilidade — o socket do Docker Desktop 29.x nao responde a
#      clientes em container (o Traefik recebe erro vazio do daemon).
#
# Os servicos sao poucos e conhecidos, entao declarar aqui e explicito e
# revisavel. Alterar este arquivo NAO exige reiniciar o Traefik (watch: true).

http:
  routers:
    # Rota de fallback: fica por ultimo de proposito, para que qualquer servico
    # extraido do monolito possa reivindicar seu prefixo com priority maior.
    core:
      rule: "PathPrefix(`/api`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`)"
      entryPoints: [web]
      service: core
      priority: 1

    documents:
      # /documents/docs fica fora de /api/documents para nao cair em /{document_id}.
      rule: "PathPrefix(`/api/documents`) || PathPrefix(`/documents/docs`) || PathPrefix(`/documents/openapi.json`)"
      entryPoints: [web]
      service: documents
      # Precisa ganhar do router do core, que tambem casa com esta URL.
      # Sem priority explicita o Traefik usa o tamanho da regra — e a do core,
      # por ser mais longa, vencia (104 contra 100).
      priority: 200

    communication:
      rule: "PathPrefix(`/api/v1/comunicacao`) || PathPrefix(`/api/v1/mural`) || PathPrefix(`/api/v1/notifications`) || PathPrefix(`/comunicacao/docs`) || PathPrefix(`/comunicacao/openapi.json`)"
      entryPoints: [web]
      service: communication
      priority: 200

    # /cobrancas fica só na rede Docker (core → http://finance:8080).
    # Não expor no entryPoint web: o contrato N2 é rede interna, sem JWT.
    finance:
      rule: "PathPrefix(`/api/v1/finance`) || PathPrefix(`/finance/swagger`)"
      entryPoints: [web]
      service: finance
      priority: 200

  services:
    core:
      loadBalancer:
        servers:
          - url: "http://core:8080"

    documents:
      loadBalancer:
        servers:
          - url: "http://documents:8000"

    communication:
      loadBalancer:
        servers:
          - url: "http://communication:3000"

    finance:
      loadBalancer:
        servers:
          - url: "http://finance:8080"
