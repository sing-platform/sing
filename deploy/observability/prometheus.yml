global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # O core expoe metricas via Spring Boot Actuator + Micrometer.
  - job_name: sing-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["core:8080"]

  # Servicos das entregas seguintes (E2..E5) entram aqui conforme forem criados.
