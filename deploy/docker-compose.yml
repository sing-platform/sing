name: sgs-sing-ms

# Infra base da stack poliglota (E1).
# Servicos de aplicacao entram nas entregas seguintes:
#   E2 documents (Python) · E3 communication (Node) · E4 finance (C#) · E5 reports (Python)
#
#   docker compose up -d
#   docker compose --profile observability up -d   # + Jaeger e Prometheus

services:
  # ------------------------------------------------------------- gateway ----
  traefik:
    image: traefik:v3.3
    container_name: sing-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true            # dashboard sem auth: apenas ambiente local
      # File provider em vez de docker provider: nao exige montar o docker.sock
      # (que daria acesso root ao host) e nao depende da API do daemon.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [sing]

  # ------------------------------------------------------------ core ---------
  postgres-core:
    image: postgres:16-alpine
    container_name: sing-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-sing_core}
      POSTGRES_USER: ${CORE_DB_USER:-sing}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-sing}
    ports:
      - "${CORE_DB_PORT:-5432}:5432"
    volumes:
      - pgdata-core:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER:-sing} -d ${CORE_DB_NAME:-sing_core}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [sing]

  core:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    container_name: sing-core
    restart: unless-stopped
    depends_on:
      postgres-core:
        condition: service_healthy       # sem isto o Spring sobe antes do banco e morre
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-core:5432/${CORE_DB_NAME:-sing_core}
      DB_USER: ${CORE_DB_USER:-sing}
      DB_PASSWORD: ${CORE_DB_PASSWORD:-sing}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-sing}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sing}
      # O compose ja espera o broker ficar saudavel, entao os listeners podem
      # subir junto com a aplicacao (o RabbitListenerInitializer segue como
      # rede de seguranca se o broker cair depois).
      RABBITMQ_LISTENER_AUTO_STARTUP: "true"
      SING_EVENTS_EXCHANGE: ${EVENTS_EXCHANGE:-sing.events}
      SING_SERVICES_DOCUMENTS_BASE_URL: http://documents:8000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SING_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      N2_FINANCE_BASE_URL: ${N2_FINANCE_BASE_URL:-http://finance:8080}
      N2_COBRANCA_VALOR_CENTAVOS: ${N2_COBRANCA_VALOR_CENTAVOS:-15000}
      N2_COBRANCA_PRAZO_DIAS: ${N2_COBRANCA_PRAZO_DIAS:-10}
      N2_RETRY_INTERVALO: ${N2_RETRY_INTERVALO:-30s}
      N2_RETRY_LIMITE: ${N2_RETRY_LIMITE:-10}
      N2_CLAIM_SEGUNDOS: ${N2_CLAIM_SEGUNDOS:-60}
    # Roteamento declarado em traefik/dynamic/routes.yml (file provider).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [sing]

  # ------------------------------------------------------- documents --------
  # Servico em Python (FastAPI) com banco proprio: nenhum servico le a tabela
  # do outro. Substitui o modulo `document` do core.
  postgres-documents:
    image: postgres:16-alpine
    container_name: sing-postgres-documents
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCS_DB_NAME:-sing_documents}
      POSTGRES_USER: ${DOCS_DB_USER:-sing}
      POSTGRES_PASSWORD: ${DOCS_DB_PASSWORD:-sing}
    ports:
      - "${DOCS_DB_PORT:-5433}:5432"
    volumes:
      - pgdata-documents:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCS_DB_USER:-sing} -d ${DOCS_DB_NAME:-sing_documents}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [sing]

  documents:
    build:
      context: ../services/documents
      dockerfile: Dockerfile
    container_name: sing-documents
    restart: unless-stopped
    depends_on:
      postgres-documents:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongo-documents:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${DOCS_DB_USER:-sing}:${DOCS_DB_PASSWORD:-sing}@postgres-documents:5432/${DOCS_DB_NAME:-sing_documents}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER:-singadmin}
      S3_SECRET_KEY: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no .env}
      S3_BUCKET: ${DOCS_BUCKET:-sing-documents}
      # Mesmo segredo do core: a assinatura ainda e HS256 (ver app/security.py).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-sing}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sing}
      RABBITMQ_EXCHANGE: ${EVENTS_EXCHANGE:-sing.events}
      CORE_BASE_URL: http://core:8080
      # Comprovante da matricula: Mongo proprio, sem HTTP ao core.
      MONGO_COMPROVANTES_URI: mongodb://${MONGO_DOCUMENTS_USER:-documents}:${MONGO_DOCUMENTS_PASSWORD:-documents}@mongo-documents:27017/sing_documents_comprovantes?authSource=admin
      DOCUMENTS_COMPROVANTE_MAX_BYTES: ${DOCUMENTS_COMPROVANTE_MAX_BYTES:-1048576}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [sing]

  # -------------------------------- comprovante e notificacao (N2) ----------
  # Dois Mongos de proposito: credencial e database do comprovante nao sao
  # os da comunicacao.
  mongo-documents:
    image: mongo:7
    container_name: sing-mongo-documents
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DOCUMENTS_USER:-documents}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DOCUMENTS_PASSWORD:-documents}
      MONGO_INITDB_DATABASE: sing_documents_comprovantes
    ports:
      - "${MONGO_DOCUMENTS_PORT:-27017}:27017"
    volumes:
      - mongo-documents-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [sing]

  mongo-communication:
    image: mongo:7
    container_name: sing-mongo-communication
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_COMMUNICATION_USER:-communication}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_COMMUNICATION_PASSWORD:-communication}
      MONGO_INITDB_DATABASE: sing_communication
    ports:
      - "${MONGO_COMMUNICATION_PORT:-27018}:27017"
    volumes:
      - mongo-communication-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [sing]

  communication:
    build:
      context: ../services/communication
      dockerfile: Dockerfile
    container_name: sing-communication
    restart: unless-stopped
    depends_on:
      mongo-communication:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_COMMUNICATION_USER:-communication}:${MONGO_COMMUNICATION_PASSWORD:-communication}@mongo-communication:27017/sing_communication?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-sing}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sing}
      RABBITMQ_EXCHANGE: ${EVENTS_EXCHANGE:-sing.events}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/actuator/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks: [sing]

  # ---------------------------------------------------------- finance -------
  # Servico em C# (.NET 8) com MySQL proprio. Substitui o modulo finance do
  # core e atende POST /cobrancas do contrato N2.
  mysql-finance:
    image: mysql:8.0
    container_name: sing-mysql-finance
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FINANCE_DB_NAME:-sing_finance}
      MYSQL_USER: ${FINANCE_DB_USER:-sing}
      MYSQL_PASSWORD: ${FINANCE_DB_PASSWORD:-sing}
      MYSQL_ROOT_PASSWORD: ${FINANCE_DB_ROOT_PASSWORD:-singroot}
    ports:
      - "${FINANCE_DB_PORT:-3306}:3306"
    volumes:
      - mysqldata-finance:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${FINANCE_DB_USER:-sing}", "-p${FINANCE_DB_PASSWORD:-sing}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [sing]

  finance:
    build:
      context: ../services/finance
      dockerfile: Dockerfile
    container_name: sing-finance
    restart: unless-stopped
    depends_on:
      mysql-finance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Finance: Server=mysql-finance;Port=3306;Database=${FINANCE_DB_NAME:-sing_finance};User=${FINANCE_DB_USER:-sing};Password=${FINANCE_DB_PASSWORD:-sing};
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      Jwt__Secret: ${JWT_SECRET:?defina JWT_SECRET no .env}
      Core__BaseUrl: http://core:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__User: ${RABBITMQ_USER:-sing}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-sing}
      RabbitMq__Exchange: ${EVENTS_EXCHANGE:-sing.events}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [sing]

  # -------------------------------------------------------- mensageria ------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sing-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sing}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      # O broker leva ~60s para subir (feature flags + mnesia). Sem start_period
      # o Docker conta as falhas do boot como reais e o depends_on desiste antes.
      start_period: 90s
    networks: [sing]

  # ------------------------------------------------------------ storage -----
  # MinIO substitui o Azure Blob. Usado pelo servico documents (E2).
  minio:
    image: minio/minio:latest
    container_name: sing-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-singadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD no .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [sing]

  # ----------------------------------------------------------- identity -----
  # Keycloak emite JWT RS256 e publica o JWKS: nenhum servico precisa da chave
  # privada, entao nenhum deles consegue forjar token. Ver docs/adr/0002.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: sing-keycloak
    restart: unless-stopped
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:?defina KEYCLOAK_PASSWORD no .env}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks: [sing]

  # ----------------------------------------------- observabilidade (opt) ----
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: sing-jaeger
    restart: unless-stopped
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # UI
      - "4317:4317"                        # OTLP gRPC
      - "4318:4318"                        # OTLP HTTP
    networks: [sing]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sing-prometheus
    restart: unless-stopped
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [sing]

volumes:
  pgdata-core:
  pgdata-documents:
  mysqldata-finance:
  rabbitmq-data:
  minio-data:
  keycloak-data:
  mongo-documents-data:
  mongo-communication-data:

networks:
  sing:
    driver: bridge
