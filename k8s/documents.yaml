apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documents
  template:
    metadata:
      labels:
        app: documents
    spec:
      containers:
        - name: documents
          image: ghcr.io/sing-platform/documents:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sing-config
            - secretRef:
                name: sing-secrets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
          # O health só fica UP com Postgres e MinIO. O curl está na imagem.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS http://localhost:8000/actuator/health | grep -q '"status":"UP"'
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS http://localhost:8000/actuator/health | grep -q '"status":"UP"'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -fsS http://localhost:8000/actuator/health | grep -q '"status":"UP"'
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: documents
spec:
  selector:
    app: documents
  ports:
    - name: http
      port: 8000
      targetPort: 8000
