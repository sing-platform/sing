# Senhas de laboratório, iguais às de deploy/.env.example.
# Não são segredo de produção. O arquivo real (k8s/secret.yaml) fica fora do git.
apiVersion: v1
kind: Secret
metadata:
  name: sing-secrets
type: Opaque
stringData:
  DB_PASSWORD: trocar-esta-senha
  DOCS_DB_PASSWORD: trocar-esta-senha
  RABBITMQ_PASSWORD: trocar-esta-senha
  S3_SECRET_KEY: trocar-esta-senha-min-8-chars
  MINIO_ROOT_PASSWORD: trocar-esta-senha-min-8-chars
  JWT_SECRET: troque-por-um-segredo-longo-e-aleatorio
  MONGO_DOCUMENTS_PASSWORD: trocar-esta-senha
  MONGO_COMMUNICATION_PASSWORD: trocar-esta-senha
  KEYCLOAK_PASSWORD: trocar-esta-senha
  # URLs com senha. Se trocar a senha, troque aqui também.
  DATABASE_URL: postgresql+psycopg://sing:trocar-esta-senha@postgres-documents:5432/sing_documents
  MONGO_COMPROVANTES_URI: mongodb://documents:trocar-esta-senha@mongo-documents:27017/sing_documents_comprovantes?authSource=admin
  MONGO_URI: mongodb://communication:trocar-esta-senha@mongo-communication:27017/sing_communication?authSource=admin
