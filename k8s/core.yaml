# Três réplicas para mostrar o balanceamento. O header X-Pod diz qual pod respondeu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: core
                topologyKey: kubernetes.io/hostname
      containers:
        - name: core
          image: ghcr.io/sing-platform/core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sing-config
            - secretRef:
                name: sing-secrets
          env:
            # Heap menor que o do Dockerfile: 3 réplicas num cluster de 2 nós.
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx320m"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 640Mi
          startupProbe:
            httpGet:
              # /actuator/health é público. /readiness responde 401 no SecurityConfig.
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  selector:
    app: core
  ports:
    - name: http
      port: 8080
      targetPort: 8080
