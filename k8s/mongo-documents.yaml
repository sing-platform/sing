apiVersion: v1
kind: Service
metadata:
  name: mongo-documents
spec:
  selector:
    app: mongo-documents
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-documents
spec:
  serviceName: mongo-documents
  replicas: 1
  selector:
    matchLabels:
      app: mongo-documents
  template:
    metadata:
      labels:
        app: mongo-documents
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: sing-config
                  key: MONGO_DOCUMENTS_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sing-secrets
                  key: MONGO_DOCUMENTS_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: sing-config
                  key: MONGO_DOCUMENTS_DB
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 320Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval 'db.adminCommand("ping")'
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval 'db.adminCommand("ping")'
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval 'db.adminCommand("ping")'
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
