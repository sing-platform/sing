apiVersion: v1
kind: Service
metadata:
  name: mysql-finance
spec:
  selector:
    app: mysql-finance
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-finance
spec:
  serviceName: mysql-finance
  replicas: 1
  selector:
    matchLabels:
      app: mysql-finance
  template:
    metadata:
      labels:
        app: mysql-finance
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: sing-config
                  key: FINANCE_DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: sing-config
                  key: FINANCE_DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sing-secrets
                  key: FINANCE_DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sing-secrets
                  key: FINANCE_DB_ROOT_PASSWORD
          args: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\""]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\""]
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
