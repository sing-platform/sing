# O finance (.NET + MySQL) é do Matheus e ainda não tem código neste repositório.
# Este arquivo NÃO entra no kustomization.yaml. Se entrasse, o apply tentaria
# subir um pod sem imagem e o resto da demo não depende dele.
#
# O core chama http://finance:8080/cobrancas. Enquanto este Service não existir,
# a cobrança fica pendente e o core tenta de novo. A matrícula, o comprovante
# e a notificação seguem sem o finance.
#
# Quando a imagem existir, tire os comentários e acrescente o arquivo no
# kustomization.yaml. O MySQL dele entra junto, no mesmo namespace, com
# Service próprio (não reutilize o Postgres do core nem o do documents).
